# Ativado no Render com SPRING_PROFILES_ACTIVE=prod. Sem valor padrão de
# propósito: se faltar uma variável, a aplicação não sobe, em vez de usar o
# banco ou a chave de desenvolvimento do application.properties.
# jwt.secret-padrao-dev continua definido lá: o JwtService o usa para recusar
# a chave de desenvolvimento em produção.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
jwt.secret=${JWT_SECRET}
istoque.cors.origens=${CORS_ORIGENS}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# SMS: sem SMS_PROVEDOR a aplicacao sobe e o envio de codigo responde 503.
# O provedor "log" nao funciona em producao. Com textbee, TEXTBEE_API_KEY e TEXTBEE_DEVICE_ID sao obrigatorias.
istoque.sms.provedor=${SMS_PROVEDOR:}
textbee.api-key=${TEXTBEE_API_KEY:}
textbee.device-id=${TEXTBEE_DEVICE_ID:}
