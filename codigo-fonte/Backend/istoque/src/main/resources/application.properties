spring.application.name=istoque

# Conexao com o banco PostgreSQL (Neon), compartilhado pela equipe e pelos avaliadores.
# As credenciais ficam versionadas de proposito: e um projeto academico em repositorio
# privado, e assim basta clonar e rodar. Em producao, elas viriam de variaveis de ambiente.
spring.datasource.url=jdbc:postgresql://ep-frosty-bread-acdzxz45-pooler.sa-east-1.aws.neon.tech:5432/is_toque_db?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_2uWEZKlBJH8c
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# ddl-auto=update: o Hibernate cria/atualiza as tabelas automaticamente a partir das entidades.
# Bom para desenvolvimento; pode ser revisto mais adiante no projeto (ex: migrations com Flyway).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Exibe as datas da API no fuso de Brasilia
spring.jackson.time-zone=America/Sao_Paulo

# Enderecos do front que podem chamar a API pelo navegador (CORS), separados por virgula.
# Em producao, defina a variavel de ambiente CORS_ORIGENS com o endereco do front publicado.
# Em desenvolvimento o front usa o proxy do Vite e nem passa pelo CORS.
istoque.cors.origens=${CORS_ORIGENS:http://localhost:5173,http://localhost:4173}
