spring.application.name=istoque

# Conexao com o banco PostgreSQL (Neon), compartilhado pela equipe e pelos avaliadores.
# As credenciais ficam versionadas de proposito: e um projeto academico em repositorio
# privado, e assim basta clonar e rodar. Em producao, elas viriam de variaveis de ambiente.
spring.datasource.url=jdbc:postgresql://ep-frosty-bread-acdzxz45-pooler.sa-east-1.aws.neon.tech:5432/is_toque_db?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_2uWEZKlBJH8c
spring.datasource.driver-class-name=org.postgresql.Driver

# Migracoes (Flyway)
# O banco so muda pelos scripts de src/main/resources/db/migration (V1__..., V2__...).
# Um banco que ja tem tabelas e ainda nao tem historico do Flyway e marcado como V1
# (baseline) sem rodar o script. Em banco vazio, a V1 roda e cria tudo.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JPA / Hibernate
# ddl-auto=validate: o Hibernate nao altera o banco, so confere se as entidades batem com
# as tabelas. Se nao baterem, a aplicacao nao sobe e mostra o motivo.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Exibe as datas da API no fuso de Brasilia
spring.jackson.time-zone=America/Sao_Paulo

# Enderecos do front que podem chamar a API pelo navegador (CORS), separados por virgula.
# Em producao, defina a variavel de ambiente CORS_ORIGENS com o endereco do front publicado.
# Em desenvolvimento o front usa o proxy do Vite e nem passa pelo CORS.
istoque.cors.origens=${CORS_ORIGENS:http://localhost:5173,http://localhost:4173}

# Configuracoes do JWT
# Chave so para desenvolvimento. Em producao (Render), defina a variavel de ambiente JWT_SECRET
# (Base64, minimo 32 bytes): a API se recusa a subir em producao usando esta chave.
jwt.secret-padrao-dev=Itukz17CeLhi0xbDve1EO9CtPsLBg5Z0qtV1LMbtv7VcSoWGCJbzvSgG9xPo/RpI
jwt.secret=${JWT_SECRET:${jwt.secret-padrao-dev}}
jwt.expiration-ms=28800000

# SMS (HU021). Em desenvolvimento o codigo so aparece no log (provedor "log").
# Em producao defina SMS_PROVEDOR=textbee com TEXTBEE_API_KEY e TEXTBEE_DEVICE_ID.
istoque.sms.provedor=${SMS_PROVEDOR:log}
textbee.api-key=${TEXTBEE_API_KEY:}
textbee.device-id=${TEXTBEE_DEVICE_ID:}
