# Configuracao usada SOMENTE quando os testes rodam (src/test tem prioridade
# sobre src/main no classpath). Banco H2 em memoria, criado e destruido a
# cada execucao - os testes nunca tocam no banco real do Neon.

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
# H2TestDialect = H2Dialect + suporte ao enum nativo do PostgreSQL (produto.tipo)
spring.jpa.database-platform=br.com.istoque.config.H2TestDialect
spring.jpa.show-sql=false
