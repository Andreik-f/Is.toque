# Configuracao usada SOMENTE quando os testes rodam (src/test tem prioridade
# sobre src/main no classpath). Banco H2 em memoria, criado e destruido a
# cada execucao - os testes nunca tocam no banco real do Neon.

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# O H2 nao aceita os tipos enum do PostgreSQL, entao os testes nao rodam as
# migracoes: o Hibernate cria as tabelas a partir das entidades.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

istoque.cors.origens=http://localhost:5173
