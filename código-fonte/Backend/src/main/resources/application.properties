# JPA / Hibernate
# ddl-auto=update: o Hibernate cria/atualiza as tabelas automaticamente a partir das entidades.
# Bom para desenvolvimento; pode ser revisto mais adiante no projeto (ex: migrations com Flyway).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

