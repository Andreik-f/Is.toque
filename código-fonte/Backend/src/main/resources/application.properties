spring.application.name=backend

# Ativa o application-local.properties (nao versionado no Git), que contem a URL,
# usuario e senha do banco de dados. Cada integrante da equipe deve criar esse
# arquivo localmente a partir do application-local.properties.example.
spring.profiles.active=local

# JPA / Hibernate
# ddl-auto=update: o Hibernate cria/atualiza as tabelas automaticamente a partir das entidades.
# Bom para desenvolvimento; pode ser revisto mais adiante no projeto (ex: migrations com Flyway).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
